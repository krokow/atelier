<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier — Organisation</title>
<style>
:root{
  --bg:#12151a;
  --panel:#171b21;
  --panel-2:#1d222a;
  --border:#2a2f38;
  --border-soft:#22262e;
  --text:#e7e9ec;
  --text-dim:#9aa3b0;
  --text-faint:#5f6772;
  --amber:#e0a458;
  --amber-dim:#8a6a3a;
  --blue:#6e8fd6;
  --red:#d97070;
  --green:#7fb88a;
  --track:#232a34;
  --radius:3px;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
:root[data-theme="light"]{
  --bg:#f4f2ee;
  --panel:#ffffff;
  --panel-2:#faf9f6;
  --border:#ddd8cf;
  --border-soft:#e8e4db;
  --text:#25241f;
  --text-dim:#6d685c;
  --text-faint:#a39d8e;
  --amber:#a8702a;
  --amber-dim:#c99a5c;
  --blue:#3f5da3;
  --red:#b8453f;
  --green:#3f7a4d;
  --track:#e4e0d6;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  height:100vh;
  overflow:hidden;
}
::selection{ background:var(--amber-dim); color:#111; }

/* Interface applicative, pas document. Par défaut le pointeur reste une
   flèche et le texte ne se sélectionne pas : un titre, un onglet ou un
   libellé ne doit jamais donner l'impression qu'on peut écrire dedans.
   Le curseur de texte et la sélection sont réactivés explicitement, là où
   ils ont un sens. */
html, body{
  cursor:default;
  -webkit-user-select:none; user-select:none;
}
button{ font-family:inherit; cursor:pointer; }
select{ font-family:inherit; color:inherit; cursor:pointer; }
input, textarea{
  font-family:inherit; color:inherit; cursor:text;
  -webkit-user-select:text; user-select:text;
}
[contenteditable="true"]{ cursor:text; -webkit-user-select:text; user-select:text; }
/* Contenu que l'on peut vouloir relire, sélectionner ou copier. */
.task-text, .note-body, .note-title-input, .focus-text, .stat-sub, .review-stats{
  -webkit-user-select:text; user-select:text;
}
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:5px; }
::-webkit-scrollbar-track{ background:transparent; }

#app{ display:grid; grid-template-columns:220px 1fr 300px; grid-template-rows:auto 1fr; height:100vh; }
#app.no-right{ grid-template-columns:220px 1fr; }

/* ---------- TOPBAR ---------- */
#topbar{
  grid-column:1/-1;
  display:flex; align-items:center; gap:14px;
  min-height:48px;
  padding:0 16px;
  border-bottom:1px solid var(--border-soft);
  background:var(--panel);
}
#brand{ font-family:var(--serif); font-size:17px; letter-spacing:.2px; white-space:nowrap; }
#brand span{ color:var(--amber); }
#search{
  flex:1; max-width:420px;
  background:var(--panel-2); border:1px solid var(--border-soft);
  border-radius:var(--radius); padding:6px 10px; color:var(--text); font-size:13px;
}
#search:focus{ outline:none; border-color:var(--blue); }
.topbar-spacer{ flex:1; }

/* ---------- CHRONO GLOBAL (barre du haut) ---------- */
#timerbar{
  display:flex; align-items:center; gap:12px;
  padding:5px 12px; margin:5px 0;
  border:1px solid var(--border-soft); border-radius:var(--radius);
  background:var(--panel-2);
  flex:0 1 auto; min-width:0;
}
#timerbar.running{ border-color:var(--border); }
.tbar-modes{ display:flex; }
.tbar-mode{
  background:transparent; border:1px solid var(--border-soft); color:var(--text-dim);
  font-size:12px; padding:4px 9px; white-space:nowrap;
}
.tbar-mode:first-child{ border-radius:var(--radius) 0 0 var(--radius); }
.tbar-mode:last-child{ border-radius:0 var(--radius) var(--radius) 0; margin-left:-1px; }
.tbar-mode:hover{ color:var(--text); border-color:var(--border); }
.tbar-mode.active{ color:#fff; font-weight:600; }
.tbar-mode.active.meeting{ background:var(--blue); border-color:var(--blue); }
.tbar-mode.active.progress{ background:var(--green); border-color:var(--green); color:#0d1a10; }
.tbar-elapsed{
  font-family:var(--serif); font-size:16px; font-variant-numeric:tabular-nums;
  color:var(--text-faint); min-width:74px; text-align:center;
}
.tbar-elapsed.active{ color:var(--text); }
.tbar-pause{
  background:transparent; border:1px solid var(--border-soft); border-radius:var(--radius);
  color:var(--text-dim); font-size:11px; padding:4px 8px; line-height:1.4; white-space:nowrap;
}
.tbar-pause:hover{ color:var(--text); border-color:var(--border); }
.tbar-pause:disabled{ opacity:.35; cursor:default; }
/* Jauge de la journée : la piste est une teinte atténuée de la même rampe
   que le remplissage, pour que l'état se lise sur toute la barre. */
.tbar-meter{
  width:104px; height:5px; background:var(--track); border-radius:3px; overflow:hidden; flex-shrink:1; min-width:40px;
}
.tbar-meter-fill{ height:100%; background:var(--blue); border-radius:3px; transition:width .4s ease; }
.tbar-meter-fill.reached{ background:var(--green); }
.tbar-day{
  font-size:11.5px; color:var(--text-dim); white-space:nowrap; cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.tbar-day:hover{ color:var(--text); }
.icon-btn{
  background:transparent; border:1px solid transparent; color:var(--text-dim);
  padding:6px 9px; border-radius:var(--radius); font-size:13px; display:flex; align-items:center; gap:6px;
}
.icon-btn:hover{ border-color:var(--border); color:var(--text); }
.icon-btn.active{ color:var(--amber); border-color:var(--amber-dim); }

/* ---------- SIDEBAR ---------- */
#sidebar{
  border-right:1px solid var(--border-soft);
  background:var(--panel);
  display:flex; flex-direction:column;
  overflow-y:auto;
}
.side-section{ padding:14px 12px 6px; }
.side-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-faint); padding:0 4px 8px; display:flex; justify-content:space-between; align-items:center;}
.side-add{ background:none; border:none; color:var(--text-faint); font-size:15px; line-height:1; padding:0 4px;}
.side-add:hover{ color:var(--amber); }
.nav-item{
  display:flex; align-items:center; gap:9px;
  padding:7px 8px; border-radius:var(--radius); cursor:pointer; color:var(--text-dim);
  font-size:13.5px;
}
.nav-item:hover{ background:var(--panel-2); color:var(--text); }
.nav-item.active{ background:var(--panel-2); color:var(--text); font-weight:600; }
.dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.proj-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.proj-count{ font-size:11px; color:var(--text-faint); }
.proj-bar{ height:3px; background:var(--border-soft); border-radius:2px; margin:2px 8px 8px; overflow:hidden; }
.proj-bar-fill{ height:100%; background:var(--amber-dim); }
#archived-toggle{ font-size:11.5px; color:var(--text-faint); padding:6px 8px; cursor:pointer; }
#archived-toggle:hover{ color:var(--text-dim); }

/* ---------- MAIN ---------- */
#main{ overflow-y:auto; padding:26px 34px 60px; }
.empty-state{ color:var(--text-faint); font-size:13.5px; padding-top:60px; text-align:center; }

.project-header{ display:flex; align-items:baseline; gap:12px; margin-bottom:4px; }
.project-title{
  font-family:var(--serif); font-size:26px; font-weight:400;
  border:1px solid transparent; border-radius:var(--radius);
  padding:0 5px; margin:0 -5px;
}
.project-sub{ color:var(--text-faint); font-size:12.5px; margin-bottom:18px; }
.project-actions{ display:flex; gap:6px; margin-left:auto; }

.section-title{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin:22px 0 10px; display:flex; align-items:center; gap:10px;}
.section-title .line{ flex:1; height:1px; background:var(--border-soft); }

.add-task-row{ display:flex; gap:8px; margin-bottom:10px; align-items:center; }
.add-task-row input[type=text]{
  flex:1; background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:8px 10px; font-size:13.5px; color:var(--text);
}
.add-task-row input:focus{ outline:none; border-color:var(--blue); }
.mini-select{ background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius); color:var(--text-dim); font-size:12px; padding:7px 6px; }
.btn{ background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius); padding:8px 12px; font-size:12.5px; }
.btn:hover{ border-color:var(--text-dim); }
.btn.primary{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
.btn.primary:hover{ opacity:.9; }

.task-list{ display:flex; flex-direction:column; }
.task{
  display:flex; align-items:flex-start; gap:10px; padding:9px 6px;
  border-bottom:1px solid var(--border-soft);
}
.task:hover{ background:var(--panel-2); }
.task.done{ opacity:.5; }
.task.overdue .due-badge{ color:var(--red); border-color:var(--red); }
.check{
  width:16px; height:16px; margin-top:2px; border:1.5px solid var(--text-faint); border-radius:3px;
  flex-shrink:0; display:flex; align-items:center; justify-content:center; color:transparent; font-size:11px;
  cursor:pointer;
}
.check:hover{ border-color:var(--amber); }
.task.done .check{ background:var(--green); border-color:var(--green); color:#0a1a0d; }
.task-body{ flex:1; min-width:0; }
.task-text{
  font-size:13.5px; word-break:break-word;
  width:fit-content; max-width:100%;
  border:1px solid transparent; border-radius:var(--radius);
  padding:1px 4px; margin:-1px -4px;
}
.task.done .task-text{ text-decoration:line-through; }
/* L'édition est un état visible : on ne se retrouve jamais avec un curseur
   qui clignote sans savoir pourquoi. */
.task-text.editing, .project-title.editing{
  border-color:var(--blue); background:var(--panel-2);
  text-decoration:none; cursor:text;
}
.task-text.editing{ width:100%; }
.task-text:focus, .project-title:focus{ outline:none; }
.task-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; }
.badge{ font-size:10.5px; padding:2px 6px; border-radius:2px; border:1px solid var(--border); color:var(--text-dim); }
.badge.tag{ color:var(--blue); border-color:transparent; background:rgba(110,143,214,.12); cursor:pointer;}
.prio-high{ color:var(--red); border-color:var(--red); }
.prio-medium{ color:var(--amber); border-color:var(--amber-dim); }
.prio-low{ color:var(--text-faint); }
.due-badge{ color:var(--text-dim); }
.task-controls{ display:flex; gap:4px; opacity:0; }
.task:hover .task-controls{ opacity:1; }
.tctrl{ background:none; border:none; color:var(--text-faint); font-size:13px; padding:2px 4px; }
.tctrl:hover{ color:var(--text); }
.tctrl.pinned{ color:var(--amber); opacity:1; }
.subtasks{ margin-top:6px; display:flex; flex-direction:column; gap:3px; }
.subtask{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-dim); cursor:pointer; }
.subtask .check{ width:12px; height:12px; }
.subtask.done{ text-decoration:line-through; color:var(--text-faint); }
.add-subtask{ background:none; border:none; color:var(--text-faint); font-size:11.5px; padding:2px 0; }
.add-subtask:hover{ color:var(--blue); }

/* ---------- RIGHT PANEL ---------- */
#rightpanel{ border-left:1px solid var(--border-soft); background:var(--panel); overflow-y:auto; padding:18px 16px 40px; }
.rp-title{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-bottom:10px; }
.rp-item{ padding:8px 8px; border-radius:var(--radius); margin-bottom:2px; cursor:pointer; }
.rp-item:hover{ background:var(--panel-2); }
.rp-task-text{ font-size:12.5px; }
.rp-proj-name{ font-size:10.5px; color:var(--text-faint); margin-top:2px; }
.rp-empty{ color:var(--text-faint); font-size:12px; padding:6px 8px 16px; }

/* ---------- DASHBOARD ---------- */
.hero{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:30px; padding-bottom:20px; border-bottom:1px solid var(--border-soft); }
.hero-greeting{ font-family:var(--serif); font-size:30px; font-weight:400; line-height:1.2; }
.hero-greeting em{ font-style:normal; color:var(--amber); }
.hero-date{ color:var(--text-faint); font-size:13px; margin-top:6px; text-transform:capitalize; }
.hero-clock{ font-family:var(--serif); font-size:22px; color:var(--text-dim); font-variant-numeric:tabular-nums; }

.stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border-soft); border:1px solid var(--border-soft); margin-bottom:34px; }
.stat{ background:var(--panel); padding:15px 17px 14px; border-left:2px solid transparent; display:flex; flex-direction:column; }
.stat-head{ display:flex; align-items:baseline; gap:8px; }
.stat-num{ font-family:var(--serif); font-size:30px; line-height:1.05; }
.stat-delta{ font-size:11.5px; color:var(--text-faint); white-space:nowrap; }
.stat-delta.up{ color:var(--green); }
.stat-delta.down{ color:var(--red); }
.stat-label{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.07em; margin-top:4px; }
.stat-sub{ font-size:11.5px; color:var(--text-dim); margin-top:9px; line-height:1.45; }
.stat-sub em{ font-style:normal; color:var(--text); }
/* Micro-jauge de répartition : 2px de fond entre les segments, jamais de
   bordure autour des marques. */
.stat-meter{ display:flex; gap:2px; height:4px; margin-top:10px; border-radius:2px; overflow:hidden; }
.stat-meter span{ display:block; height:100%; border-radius:2px; }
.stat-meter .seg-todo{ background:var(--text-faint); }
.stat-meter .seg-progress{ background:var(--blue); }
.stat-meter .seg-waiting{ background:var(--amber); }
.stat-meter .seg-empty{ background:var(--track); flex:1; }
.stat-track{ height:4px; background:var(--track); border-radius:2px; margin-top:10px; overflow:hidden; }
.stat-track-fill{ height:100%; background:var(--blue); border-radius:2px; }
.stat-track-fill.reached{ background:var(--green); }
.stat.accent-red{ border-left-color:var(--red); }
.stat.accent-amber{ border-left-color:var(--amber); }
.stat.accent-green{ border-left-color:var(--green); }
.stat.accent-blue{ border-left-color:var(--blue); }

.dash-row{ display:grid; grid-template-columns:1.3fr 1fr; gap:40px; margin-bottom:8px; }

.focus-list{ display:flex; flex-direction:column; gap:2px; }
.focus-empty{ color:var(--text-faint); font-size:13px; padding:18px 4px; border:1px dashed var(--border); border-radius:var(--radius); text-align:center; }
.focus-item{ display:flex; align-items:flex-start; gap:12px; padding:12px 6px; border-bottom:1px solid var(--border-soft); cursor:default; }
.focus-item:hover{ background:var(--panel-2); }
.focus-check{ width:18px; height:18px; margin-top:1px; border:1.5px solid var(--text-faint); border-radius:3px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:transparent; font-size:12px; cursor:pointer; }
.focus-check:hover{ border-color:var(--amber); }
.focus-text{ font-size:14.5px; }
.focus-meta{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }
.focus-meta.late{ color:var(--red); }
.focus-goto{ font-size:11px; color:var(--text-faint); background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius); padding:3px 8px; align-self:center; margin-left:auto; flex-shrink:0; cursor:pointer; }
.focus-goto:hover{ color:var(--text); border-color:var(--text-dim); }

.chart-wrap{ display:flex; align-items:flex-end; gap:10px; height:120px; padding-top:10px; }
.chart-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end; }
.chart-bar{ width:100%; max-width:34px; border-radius:3px 3px 0 0; background:var(--amber-dim); transition:height .3s ease; position:relative; }
.chart-bar.today{ background:var(--amber); }
.chart-bar-num{ position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:11px; color:var(--text-dim); }
.chart-day{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; }

.donut-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:22px 14px; }
.donut-card{ display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; padding:10px 6px; border-radius:var(--radius); }
.donut-card:hover{ background:var(--panel-2); }
.donut{ width:68px; height:68px; border-radius:50%; position:relative; }
.donut-hole{ position:absolute; inset:9px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
.donut-name{ font-size:12px; text-align:center; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.donut-sub{ font-size:10.5px; color:var(--text-faint); }

/* ---------- WEEKLY REVIEW BANNER ---------- */
.review-banner{ display:flex; align-items:flex-start; gap:18px; background:var(--panel-2); border:1px solid var(--amber-dim); border-left:3px solid var(--amber); border-radius:var(--radius); padding:16px 18px; margin-bottom:28px; }
.review-title{ font-family:var(--serif); font-size:16.5px; margin-bottom:8px; }
.review-stats{ display:flex; gap:26px; flex-wrap:wrap; }
.review-stat-num{ font-size:19px; font-family:var(--serif); }
.review-stat-label{ font-size:11px; color:var(--text-faint); }
.review-close{ margin-left:auto; background:none; border:none; color:var(--text-faint); font-size:15px; flex-shrink:0; }
.review-projects{ margin-top:15px; padding-top:12px; border-top:1px solid var(--border-soft); }
.review-sub{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); margin-bottom:9px; }
.review-proj{ margin-bottom:10px; }
.review-proj:last-child{ margin-bottom:0; }
.review-proj-head{ display:flex; align-items:center; gap:8px; font-size:13px; }
.review-proj-count{ color:var(--text-faint); font-size:11.5px; }
.review-proj-items{ font-size:12.5px; color:var(--text-dim); margin-top:3px; padding-left:16px; line-height:1.65; }
.review-close:hover{ color:var(--text); }

/* ---------- TIME TRACKER ---------- */
.timer-box{ border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px; margin-bottom:32px; }
.timer-modes{ display:flex; gap:8px; margin-bottom:14px; }
.timer-mode-btn{ flex:1; background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim); border-radius:var(--radius); padding:10px 8px; font-size:13px; text-align:center; }
.timer-mode-btn:hover{ border-color:var(--text-dim); }
.timer-mode-btn.running{ color:#fff; font-weight:600; }
.timer-mode-btn.running.meeting{ background:var(--blue); border-color:var(--blue); }
.timer-mode-btn.running.progress{ background:var(--green); border-color:var(--green); color:#0d1a10; }
.timer-live{ text-align:center; font-family:var(--serif); font-size:26px; font-variant-numeric:tabular-nums; margin-bottom:14px; color:var(--text-dim); }
.timer-live.active{ color:var(--text); }
.timer-day{ border-top:1px solid var(--border-soft); padding-top:12px; margin-bottom:14px; }
.timer-day-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; }
.timer-day-head span:last-child{ text-transform:none; letter-spacing:0; font-size:12.5px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.timer-day .stat-track{ margin-top:7px; }
.timer-week{ display:flex; gap:22px; border-top:1px solid var(--border-soft); padding-top:12px; }
.timer-week-item{ flex:1; }
.timer-week-num{ font-size:16px; font-family:var(--serif); }
.timer-week-label{ font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; }
.timer-week-num.meeting{ color:var(--blue); }
.timer-week-num.progress{ color:var(--green); }

/* ---------- CALENDAR ---------- */
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border-soft); border:1px solid var(--border-soft); }
.cal-headcell{ background:var(--panel); padding:8px 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); text-align:center; }
.cal-cell{ background:var(--panel); min-height:70px; padding:6px 8px; cursor:pointer; }
.cal-cell.empty{ background:var(--bg); cursor:default; }
.cal-cell:hover{ background:var(--panel-2); }
.cal-cell.today .cal-daynum{ color:var(--amber); font-weight:700; }
.cal-cell.selected{ box-shadow:inset 0 0 0 1.5px var(--blue); }
.cal-daynum{ font-size:12.5px; color:var(--text-dim); }
.cal-dots{ display:flex; gap:3px; margin-top:8px; flex-wrap:wrap; align-items:center; }
.cal-dot{ width:6px; height:6px; border-radius:50%; }
.cal-more{ font-size:9.5px; color:var(--text-faint); }

/* ---------- STATUS & CANCELLED ---------- */
.status-todo{ color:var(--text-faint); }
.status-progress{ color:var(--blue); border-color:var(--blue); }
.status-waiting{ color:var(--amber); border-color:var(--amber-dim); }
.task.cancelled{ opacity:.45; }
.task.cancelled .task-text{ text-decoration:line-through; }
.task.cancelled .check{ border-color:var(--text-faint); }

/* ---------- MISC ---------- */
.hidden{ display:none !important; }
#toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
  padding:10px 14px; font-size:13px; display:flex; align-items:center; gap:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.35); z-index:300;
}
#toast button{ background:none; border:none; color:var(--amber); font-weight:600; font-size:12.5px; }
.modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:200; }
.modal{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; width:340px; }
.modal h3{ font-family:var(--serif); font-weight:400; font-size:17px; margin-bottom:14px; }
.modal .field{ margin-bottom:12px; }
.modal label{ font-size:11.5px; color:var(--text-faint); display:block; margin-bottom:4px; }
.modal input, .modal select{ width:100%; background:var(--panel-2); border:1px solid var(--border-soft); border-radius:var(--radius); padding:7px 9px; font-size:13px; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
.swatches{ display:flex; gap:6px; }
.swatch{ width:20px; height:20px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
.swatch.selected{ border-color:var(--text); }
#file-input{ display:none; }

/* ---------- LIENS DU PROJET ---------- */
.links-block{ margin-bottom:22px; }
.links-head{
  display:flex; align-items:center; gap:8px; cursor:pointer;
  font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint);
  padding:4px 0;
}
.links-head:hover{ color:var(--text-dim); }
.links-head .line{ flex:1; height:1px; background:var(--border-soft); }
.links-body{ padding-top:8px; }
.link-add{ display:flex; gap:8px; margin-bottom:8px; }
.link-add input{
  flex:1; background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:7px 10px; font-size:13px; color:var(--text);
}
.link-add input:focus{ outline:none; border-color:var(--blue); }
.link-row{
  display:flex; align-items:center; gap:10px;
  padding:7px 6px; border-bottom:1px solid var(--border-soft);
}
.link-row:hover{ background:var(--panel-2); }
.link-main{ flex:1; min-width:0; }
.link-title{
  font-size:13.5px; color:var(--blue); text-decoration:none;
  display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  vertical-align:bottom; cursor:pointer;
}
.link-title:hover{ text-decoration:underline; }
.link-sub{ font-size:11px; color:var(--text-faint); margin-top:2px; }
.link-note{ color:var(--text-dim); }
.link-ctrls{ display:flex; gap:4px; opacity:0; }
.link-row:hover .link-ctrls{ opacity:1; }

/* ---------- EXPLORATEUR DE NOTES ---------- */
.notes-panel{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  width:min(1080px, 94vw); height:min(720px, 86vh);
  display:grid; grid-template-columns:262px 1fr; overflow:hidden;
}
.notes-side{
  border-right:1px solid var(--border-soft); background:var(--panel-2);
  display:flex; flex-direction:column; min-height:0;
}
.notes-side-head{ padding:12px 12px 10px; border-bottom:1px solid var(--border-soft); }
.notes-side-title{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint);
  display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;
}
.notes-filter{
  width:100%; background:var(--panel); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:6px 9px; font-size:12.5px; color:var(--text); margin-bottom:8px;
}
.notes-filter:focus{ outline:none; border-color:var(--blue); }
.notes-list{ flex:1; overflow-y:auto; padding:6px; min-height:0; }
.note-row{
  padding:9px 9px; border-radius:var(--radius); cursor:pointer;
  border:1px solid transparent; margin-bottom:2px;
}
.note-row:hover{ background:var(--panel); }
.note-row.active{ background:var(--panel); border-color:var(--border); }
.note-row-title{
  font-size:13px; color:var(--text); display:flex; align-items:baseline; gap:6px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.note-row-pin{ color:var(--amber); font-size:11px; flex-shrink:0; }
.note-row-meta{ font-size:10.5px; color:var(--text-faint); margin-top:3px; }
.note-row-excerpt{
  font-size:11.5px; color:var(--text-dim); margin-top:4px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.notes-editor{ display:flex; flex-direction:column; min-width:0; min-height:0; }
.notes-editor-head{ padding:14px 18px 10px; border-bottom:1px solid var(--border-soft); }
.note-title-input{
  width:100%; background:transparent; border:none; padding:0;
  font-family:var(--serif); font-size:20px; color:var(--text);
}
.note-title-input:focus{ outline:none; }
.note-meta{ font-size:11.5px; color:var(--text-faint); margin-top:5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.note-saved{ color:var(--green); }
.note-body{
  flex:1; width:100%; resize:none; border:none; background:transparent;
  padding:16px 18px; font-size:14px; line-height:1.7; color:var(--text);
  font-family:var(--sans); min-height:0;
}
.note-body:focus{ outline:none; }
.notes-toolbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:9px 14px; border-top:1px solid var(--border-soft); background:var(--panel-2);
}
.notes-toolbar .hint{ font-size:11px; color:var(--text-faint); margin-left:auto; }
.notes-empty{
  flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
  color:var(--text-faint); font-size:13px; padding:30px;
}
.notes-back{ display:none; }
@media (max-width:820px){
  .notes-panel{ grid-template-columns:1fr; width:96vw; height:90vh; }
  .notes-panel.on-note .notes-side{ display:none; }
  .notes-panel:not(.on-note) .notes-editor{ display:none; }
  .notes-back{ display:inline-block; }
}
kbd{ background:var(--panel-2); border:1px solid var(--border); border-radius:3px; padding:0 5px; font-size:11px; color:var(--text-dim); }
.help-list{ font-size:12.5px; color:var(--text-dim); line-height:2; }

/* ---------- RESPONSIVE ----------
   Trois paliers : colonnes resserrées, puis le panneau de droite passe en
   bandeau bas (rien n'est masqué), puis tout s'empile en une colonne. */
@media (max-width:1320px){
  #search{ max-width:230px; }
  .tbar-day{ display:none; }
}
@media (max-width:1180px){
  #app{ grid-template-columns:196px 1fr 254px; }
  #main{ padding:24px 26px 60px; }
  .dash-row{ gap:28px; }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
}
/* Sous ce seuil le chrono prend sa propre ligne plutôt que d'écraser
   la recherche et les boutons. */
@media (max-width:1120px){
  #topbar{ flex-wrap:wrap; padding:0 14px 8px; }
  #timerbar{ order:9; flex:1 1 100%; margin:0; }
  .tbar-day{ display:block; margin-left:auto; }
  .tbar-meter{ width:auto; flex:1 1 auto; max-width:none; }
}
@media (max-width:1020px){
  #app{ grid-template-columns:190px 1fr; grid-template-rows:auto 1fr auto; }
  #rightpanel{
    grid-column:1/-1;
    border-left:none; border-top:1px solid var(--border-soft);
    max-height:28vh; padding:14px 16px 20px;
  }
  #main{ padding:22px 22px 40px; }
  .dash-row{ grid-template-columns:1fr; gap:4px; }
  .donut-grid{ grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); }
}
@media (max-width:760px){
  body{ height:auto; overflow:auto; }
  #app{ grid-template-columns:1fr; grid-template-rows:auto auto 1fr auto; height:auto; min-height:100vh; }
  #topbar{ height:auto; min-height:48px; flex-wrap:wrap; gap:8px 10px; padding:9px 12px; }
  #search{ order:8; flex:1 1 100%; max-width:none; }
  #timerbar{ flex-wrap:wrap; gap:8px 10px; }
  .tbar-elapsed{ min-width:66px; }
  #sidebar{
    border-right:none; border-bottom:1px solid var(--border-soft);
    overflow:visible;
  }
  .side-section{ padding:10px 12px 4px; }
  .side-section[style*="flex:1"]{ flex:0 0 auto !important; }
  #main{ padding:20px 16px 40px; overflow:visible; }
  #rightpanel{ max-height:none; overflow:visible; }
  .project-header{ flex-wrap:wrap; }
  .project-actions{ margin-left:0; }
  .add-task-row{ flex-wrap:wrap; }
  .add-task-row input[type=text]{ flex:1 1 100%; }
  .cal-cell{ min-height:56px; padding:5px 5px; }
  .cal-headcell{ padding:6px 2px; font-size:9.5px; }
}
@media (max-width:560px){
  .hero{ flex-direction:column; align-items:flex-start; gap:8px; }
  .hero-greeting{ font-size:25px; }
  .stat-grid{ grid-template-columns:1fr; }
  .tbar-meter{ max-width:none; }
  .timer-week{ flex-wrap:wrap; gap:12px; }
  .review-banner{ flex-wrap:wrap; gap:10px; }
  .review-stats{ gap:16px; }
  .chart-wrap{ gap:5px; }
  .modal{ width:auto; max-width:92vw; }
}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div id="brand">Atelier<span>.</span></div>
    <input id="search" type="text" placeholder="Rechercher…  (/)">
    <div class="topbar-spacer"></div>

    <div id="timerbar">
      <div class="tbar-modes">
        <button class="tbar-mode meeting" data-mode="meeting">Réunion</button>
        <button class="tbar-mode progress" data-mode="progress">Avancement</button>
      </div>
      <div class="tbar-elapsed" id="tbar-elapsed">00:00:00</div>
      <button class="tbar-pause" id="tbar-pause">Pause</button>
      <div class="tbar-meter" id="tbar-meter"><div class="tbar-meter-fill" id="tbar-meter-fill"></div></div>
      <div class="tbar-day" id="tbar-day" title="Cliquer pour changer l'objectif quotidien">0 min / 8 h</div>
    </div>

    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="btn-capture" title="Capture rapide (i)">+ Capture</button>
    <button class="icon-btn" id="btn-theme" title="Thème">Thème</button>
    <button class="icon-btn" id="btn-export" title="Exporter en JSON">Exporter</button>
    <button class="icon-btn" id="btn-import" title="Importer un JSON">Importer</button>
    <button class="icon-btn" id="btn-help" title="Raccourcis">?</button>
    <input type="file" id="file-input" accept="application/json">
  </div>

  <div id="sidebar">
    <div class="side-section">
      <div class="side-label">Vue</div>
      <div class="nav-item" id="nav-dashboard">Tableau de bord</div>
      <div class="nav-item" id="nav-calendar">Calendrier</div>
      <div class="nav-item" id="nav-inbox"><span class="proj-name">Boîte de réception</span><span class="proj-count"></span></div>
    </div>
    <div class="side-section" style="flex:1">
      <div class="side-label">Projets <button class="side-add" id="add-project">+</button></div>
      <div id="project-list"></div>
      <div id="archived-toggle">Projets archivés ▸</div>
      <div id="archived-list"></div>
    </div>
  </div>

  <div id="main"></div>

  <div id="rightpanel"></div>
</div>

<div id="toast" class="hidden"></div>

<script>
(function(){
"use strict";

/* ===================== STATE ===================== */
const STORAGE_KEY = 'atelier_organiser_v1';
const COLORS = ['#e0a458','#6e8fd6','#7fb88a','#d97070','#b48fd6','#5fb3b3','#c9a15a','#8fa8d6'];

const SCHEMA_VERSION = 2;
function defaultState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    projects: [],
    trash: [],
    inbox: [],
    timeTracking: { current:null, entries:[], lastMode:null },
    view: {type:'dashboard', projectId:null},
    settings: {theme:'dark', showArchived:false, reviewDismissedDate:null, dailyTargetHours:8},
    notified: {}
  };
}
/* Remet en forme un état chargé du localStorage ou importé depuis un JSON.
   Une sauvegarde ancienne ou partielle (sans inbox, sans settings, sans
   timeTracking…) ne doit jamais casser l'application au démarrage. */
function normalizeState(s){
  const d = defaultState();
  if(!s || typeof s!=='object') return d;
  if(!Array.isArray(s.projects)) s.projects = d.projects;
  if(!Array.isArray(s.trash)) s.trash = d.trash;
  if(!Array.isArray(s.inbox)) s.inbox = d.inbox;
  if(!s.timeTracking || typeof s.timeTracking!=='object') s.timeTracking = d.timeTracking;
  if(!Array.isArray(s.timeTracking.entries)) s.timeTracking.entries = [];
  if(!s.timeTracking.current || typeof s.timeTracking.current.start!=='number') s.timeTracking.current = null;
  if(!s.settings || typeof s.settings!=='object') s.settings = d.settings;
  if(s.settings.theme!=='light' && s.settings.theme!=='dark') s.settings.theme = 'dark';
  if(typeof s.settings.showArchived!=='boolean') s.settings.showArchived = false;
  if(!('reviewDismissedDate' in s.settings)) s.settings.reviewDismissedDate = null;
  if(typeof s.settings.dailyTargetHours!=='number' || s.settings.dailyTargetHours<=0) s.settings.dailyTargetHours = 8;
  if(['meeting','progress'].indexOf(s.timeTracking.lastMode)<0) s.timeTracking.lastMode = null;
  if(!s.notified || typeof s.notified!=='object') s.notified = {};
  if(!s.view || typeof s.view!=='object' || !s.view.type) s.view = d.view;
  s.schemaVersion = SCHEMA_VERSION;
  s.projects.forEach(p=>{
    if(!p.id) p.id = uid();
    if(typeof p.name!=='string') p.name = 'Projet sans nom';
    if(typeof p.color!=='string') p.color = COLORS[0];
    if(typeof p.createdAt!=='number') p.createdAt = now();
    p.archived = !!p.archived;
    if(!Array.isArray(p.tasks)) p.tasks = [];
    p.tasks.forEach(normalizeTask);
    if(!Array.isArray(p.docs)) p.docs = [];
    p.docs.forEach(normalizeDoc);
    if(!Array.isArray(p.links)) p.links = [];
    p.links = p.links.filter(l=>l && typeof l.url==='string' && l.url.trim());
    p.links.forEach(normalizeLink);
    p.linksOpen = p.linksOpen===undefined ? true : !!p.linksOpen;
  });
  s.inbox = s.inbox.filter(i=>i && typeof i.text==='string').map(i=>{
    if(!i.id) i.id = uid();
    if(typeof i.createdAt!=='number') i.createdAt = now();
    return i;
  });
  return s;
}
function normalizeDoc(d){
  if(!d.id) d.id = uid();
  if(typeof d.title!=='string') d.title = 'Sans titre';
  if(typeof d.body!=='string') d.body = '';
  d.pinned = !!d.pinned;
  if(typeof d.createdAt!=='number') d.createdAt = now();
  if(typeof d.updatedAt!=='number') d.updatedAt = d.createdAt;
  if(typeof d.meetingMs!=='number') d.meetingMs = null;
  if(typeof d.meetingStart!=='number') d.meetingStart = null;
  return d;
}
function normalizeLink(l){
  if(!l.id) l.id = uid();
  l.url = normalizeUrl(l.url);
  if(typeof l.title!=='string' || !l.title.trim()) l.title = hostOf(l.url);
  if(typeof l.note!=='string') l.note = '';
  if(typeof l.createdAt!=='number') l.createdAt = now();
  return l;
}
/* Une adresse tapée sans protocole reste ouvrable : on complète en https. */
function normalizeUrl(url){
  const u = String(url||'').trim();
  if(!u) return '';
  return /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : 'https://' + u;
}
function hostOf(url){
  try{ return new URL(url).hostname.replace(/^www\./,''); }
  catch(e){ return url.replace(/^[a-z]+:\/\//i,'').split('/')[0] || url; }
}

function normalizeTask(t){
  if(!t.id) t.id = uid();
  if(typeof t.text!=='string') t.text = '';
  t.done = !!t.done;
  t.cancelled = !!t.cancelled;
  t.pinned = !!t.pinned;
  if(['low','medium','high'].indexOf(t.priority)<0) t.priority = 'medium';
  if(['todo','progress','waiting'].indexOf(t.status)<0) t.status = 'todo';
  if(typeof t.waitingOn!=='string') t.waitingOn = '';
  if(typeof t.due!=='number') t.due = null;
  if(!Array.isArray(t.tags)) t.tags = [];
  t.tags = t.tags.filter(x=>typeof x==='string');
  if(!Array.isArray(t.subtasks)) t.subtasks = [];
  t.subtasks.forEach(sub=>{
    if(!sub.id) sub.id = uid();
    if(typeof sub.text!=='string') sub.text = '';
    sub.done = !!sub.done;
  });
  if(['daily','weekly','monthly'].indexOf(t.recurring)<0) t.recurring = null;
  if(typeof t.createdAt!=='number') t.createdAt = now();
  if(typeof t.completedAt!=='number') t.completedAt = t.done ? now() : null;
  return t;
}

let state = normalizeState(load());

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function now(){ return Date.now(); }

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ console.error('Chargement impossible', e); return null; }
}
let saveTimer=null;
let saveFailed=false;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      saveFailed = false;
    }catch(e){
      console.error('Sauvegarde impossible', e);
      /* Le stockage local est plein ou inaccessible. Se taire ferait perdre
         du travail sans que rien ne l'indique. */
      if(!saveFailed){
        saveFailed = true;
        toast("Sauvegarde impossible : espace de stockage saturé. Exporte tes données maintenant.", 'Exporter', exportData);
      }
    }
  }, 150);
}
/* La corbeille ne sert qu'à annuler une suppression récente : rien ne la
   relit ensuite, et au-delà d'une semaine elle ne fait qu'alourdir la
   sauvegarde. */
const TRASH_KEEP_MS = 7*86400000;
function purgeTrash(){
  const cutoff = now() - TRASH_KEEP_MS;
  const before = state.trash.length;
  state.trash = state.trash.filter(t=> typeof t.deletedAt==='number' && t.deletedAt > cutoff);
  return state.trash.length !== before;
}

function seedIfEmpty(){
  if(state.projects.length>0) return;
  const p = {
    id: uid(), name:'Premiers pas', color: COLORS[0], archived:false, createdAt: now(),
    links: [], linksOpen: true,
    docs: [{
      id: uid(), title: 'Comment marchent les notes', pinned:false,
      createdAt: now(), updatedAt: now(), meetingMs:null, meetingStart:null,
      body: "Chaque projet a ses propres notes, ouvertes par le bouton Notes ou par la touche d.\n\nLe texte s'enregistre au fur et à mesure, il n'y a rien à valider.\n\nSélectionne une ligne et fais Ctrl+Entrée : elle devient une tâche du projet, sans que cette note soit modifiée."
    }],
    tasks: [
      {id:uid(), text:'Épingler une tâche importante (icône étoile au survol)', done:false, cancelled:false, pinned:true, priority:'medium', status:'todo', waitingOn:'', due:null, tags:['exemple'], subtasks:[], recurring:null, createdAt:now(), completedAt:null},
      {id:uid(), text:'Explorer le tableau de bord', done:false, cancelled:false, pinned:false, priority:'low', status:'todo', waitingOn:'', due:null, tags:[], subtasks:[], recurring:null, createdAt:now(), completedAt:null},
      {id:uid(), text:'Une tâche déjà validée (reste visible, ne disparaît pas)', done:true, cancelled:false, pinned:false, priority:'low', status:'todo', waitingOn:'', due:null, tags:[], subtasks:[], recurring:null, createdAt:now()-90000, completedAt:now()-30000},
    ]
  };
  state.projects.push(p);
  state.view = {type:'project', projectId:p.id};
  save();
}
seedIfEmpty();

/* ===================== HELPERS ===================== */
function activeProjects(){ return state.projects.filter(p=>!p.archived); }
function archivedProjects(){ return state.projects.filter(p=>p.archived); }
function getProject(id){ return state.projects.find(p=>p.id===id); }
function allTasks(){
  const out=[];
  state.projects.forEach(p=>p.tasks.forEach(t=>out.push({...t, projectId:p.id, projectName:p.name, projectColor:p.color})));
  return out;
}
function fmtDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
}
function isOverdue(t){
  return t.due && !t.done && !t.cancelled && t.due < startOfToday();
}
function startOfDay(ts){
  const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime();
}
/* Décalage en jours calendaires, pas en millisecondes : reste juste
   quand un changement d'heure tombe dans l'intervalle. */
function addDays(ts, n){
  const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return d.getTime();
}
function startOfToday(){ return startOfDay(Date.now()); }
function daysFromNow(n){ return addDays(Date.now(), n); }
function startOfWeekMonday(ts){
  const d = new Date(ts); d.setHours(0,0,0,0);
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d.getTime();
}
function startOfMonth(ts){
  const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(1); return d.getTime();
}
function fmtDuration(ms){
  const totalMin = Math.round(ms/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  if(h<=0) return `${m} min`;
  return m>0 ? `${h} h ${m} min` : `${h} h`;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, actionLabel, actionFn){
  const el = document.getElementById('toast');
  el.innerHTML = '<span></span>';
  el.querySelector('span').textContent = msg;
  if(actionLabel){
    const btn = document.createElement('button');
    btn.textContent = actionLabel;
    btn.onclick = ()=>{ actionFn(); el.classList.add('hidden'); };
    el.appendChild(btn);
  }
  el.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.add('hidden'), 6000);
}

function addProject(name, color){
  const p = {id:uid(), name:name||'Nouveau projet', color: color||COLORS[state.projects.length%COLORS.length], archived:false, createdAt:now(), notes:'', tasks:[]};
  state.projects.push(p);
  state.view = {type:'project', projectId:p.id};
  save(); render();
  return p;
}
function deleteProject(id){
  const idx = state.projects.findIndex(p=>p.id===id);
  if(idx<0) return;
  const [removed] = state.projects.splice(idx,1);
  state.trash.push({type:'project', data:removed, deletedAt:now()});
  purgeTrash();
  if(state.view.projectId===id) state.view = {type:'dashboard'};
  save(); render();
  toast('Projet supprimé.', 'Annuler', ()=>{
    state.projects.splice(Math.min(idx, state.projects.length), 0, removed);
    state.trash = state.trash.filter(t=>t.data.id!==id);
    save(); render();
  });
}
function archiveProject(id, val){
  const p = getProject(id); if(!p) return;
  p.archived = val;
  if(val && state.view.projectId===id) state.view={type:'dashboard'};
  save(); render();
}
function addTask(projectId, text, opts){
  const p = getProject(projectId); if(!p||!text.trim()) return;
  const t = Object.assign({id:uid(), text:text.trim(), done:false, cancelled:false, pinned:false, priority:'medium', status:'todo', waitingOn:'', due:null, tags:[], subtasks:[], recurring:null, createdAt:now(), completedAt:null}, opts||{});
  p.tasks.unshift(t);
  save(); render();
}
function toggleDone(projectId, taskId){
  const p = getProject(projectId); if(!p) return;
  const t = p.tasks.find(x=>x.id===taskId); if(!t) return;
  t.done = !t.done;
  t.completedAt = t.done ? now() : null;
  if(t.done) t.cancelled = false;
  if(t.done && t.recurring){
    const next = Object.assign({}, t, {id:uid(), done:false, cancelled:false, completedAt:null, createdAt:now()});
    next.due = nextRecurringDate(t.due, t.recurring);
    p.tasks.unshift(next);
  }
  save(); render();
}
function toggleCancelled(projectId, taskId){
  const p = getProject(projectId); if(!p) return;
  const t = p.tasks.find(x=>x.id===taskId); if(!t) return;
  t.cancelled = !t.cancelled;
  if(t.cancelled){ t.done = false; t.completedAt = null; }
  save(); render();
}
function nextRecurringDate(due, rule){
  const base = due ? new Date(due) : new Date();
  base.setHours(0,0,0,0);
  if(rule==='daily') base.setDate(base.getDate()+1);
  else if(rule==='weekly') base.setDate(base.getDate()+7);
  else if(rule==='monthly') base.setMonth(base.getMonth()+1);
  return base.getTime();
}
function deleteTask(projectId, taskId){
  const p = getProject(projectId); if(!p) return;
  const idx = p.tasks.findIndex(t=>t.id===taskId); if(idx<0) return;
  const [removed] = p.tasks.splice(idx,1);
  state.trash.push({type:'task', data:removed, projectId, deletedAt:now()});
  purgeTrash();
  save(); render();
  toast('Tâche supprimée.', 'Annuler', ()=>{
    const pr = getProject(projectId);
    if(pr) pr.tasks.splice(Math.min(idx, pr.tasks.length), 0, removed);
    state.trash = state.trash.filter(x=>!(x.type==='task' && x.data.id===taskId));
    save(); render();
  });
}
function togglePin(projectId, taskId){
  const p = getProject(projectId); if(!p) return;
  const t = p.tasks.find(x=>x.id===taskId); if(!t) return;
  t.pinned = !t.pinned;
  save(); render();
}
function updateTask(projectId, taskId, patch){
  const p = getProject(projectId); if(!p) return;
  const t = p.tasks.find(x=>x.id===taskId); if(!t) return;
  Object.assign(t, patch);
  save(); render();
}
function addSubtask(projectId, taskId, text){
  const p = getProject(projectId); if(!p||!text.trim()) return;
  const t = p.tasks.find(x=>x.id===taskId); if(!t) return;
  t.subtasks.push({id:uid(), text:text.trim(), done:false});

}
function toggleSubtask(projectId, taskId, subId){
  const p = getProject(projectId); if(!p) return;
  const t = p.tasks.find(x=>x.id===taskId); if(!t) return;
  const s = t.subtasks.find(x=>x.id===subId); if(!s) return;
  s.done = !s.done;
  save(); render();
}

function addInboxItem(text){

/* ---- Suivi du temps ---- */
function toggleTimer(mode){
  const tt = state.timeTracking;
  if(tt.current && tt.current.mode===mode){
    stopTimer();
  } else {
    if(tt.current) stopTimer();
    tt.current = {mode, start: now()};
    tt.lastMode = mode;
    save(); render();
  }
}
/* Mettre en pause revient à clore la tranche en cours : le total du jour est
   conservé, et « Reprendre » relance le dernier mode utilisé. */
function resumeTimer(){
  const tt = state.timeTracking;
  if(tt.current) return;
  toggleTimer(tt.lastMode || 'progress');
}
function modeLabel(mode){ return mode==='meeting' ? 'Réunion' : 'Avancement'; }
function dailyTargetMs(){ return state.settings.dailyTargetHours * 3600000; }
/* Temps travaillé aujourd'hui, chrono en cours compris. Rien n'est reporté
   d'un jour sur l'autre : à minuit le total repart de zéro tout seul,
   puisqu'il est recalculé depuis les entrées datées du jour. */
function todayWorked(){
  const day = startOfToday();
  const tt = state.timeTracking;
  let meeting=0, progress=0;
  const add = (mode, ms)=>{ if(mode==='meeting') meeting+=ms; else progress+=ms; };
  tt.entries.forEach(e=>{ if(e.date===day) add(e.mode, e.ms); });
  if(tt.current){
    const mode = tt.current.mode;
    forEachDaySlice(tt.current.start, now(), (dayStart, ms)=>{ if(dayStart===day) add(mode, ms); });
  }
  return {meeting, progress, total: meeting+progress};
}
function stopTimer(){
  const tt = state.timeTracking;
  if(!tt.current) return;
  const mode = tt.current.mode;
  const start = tt.current.start;
  tt.lastMode = mode;
  forEachDaySlice(start, now(), (dayStart, ms)=>{
    if(ms>2000) tt.entries.push({id:uid(), date:dayStart, mode, ms});
  });
  linkMeetingToDoc(mode, start, now());
  tt.current = null;
  save(); render();
}
/* Découpe une plage en tranches jour par jour. Un chrono laissé tourner la
   nuit — ou pendant que le PC est éteint — ne doit pas être imputé en entier
   au jour où on l'arrête, sinon les totaux hebdomadaires sont faux. */
function forEachDaySlice(start, end, fn){
  let cursor = start;
  let guard = 0;
  while(cursor < end && guard++ < 400){
    const dayStart = startOfDay(cursor);
    const dayEnd = addDays(dayStart, 1);
    fn(dayStart, Math.min(end, dayEnd) - cursor);
    cursor = dayEnd;
  }
}
function weeklyTimeTotals(weekStart){
  const weekEnd = addDays(weekStart, 7);
  const tt = state.timeTracking;
  let meeting=0, progress=0;
  const add = (mode, ms)=>{ if(mode==='meeting') meeting+=ms; else progress+=ms; };
  tt.entries.forEach(e=>{
    if(e.date>=weekStart && e.date<weekEnd) add(e.mode, e.ms);
  });
  if(tt.current){
    const mode = tt.current.mode;
    forEachDaySlice(tt.current.start, now(), (dayStart, ms)=>{
      if(dayStart>=weekStart && dayStart<weekEnd) add(mode, ms);
    });
  }
  return {meeting, progress};
}
function dismissWeeklyReview(){
  state.settings.reviewDismissedDate = new Date().toDateString();
  save(); render();
}

/* ===================== RENDER ===================== */
/* Identifiant de la vue affichée. Sert à savoir si un rendu est un simple
   rafraîchissement (on garde la position de défilement et le focus) ou un
   vrai changement de vue (on repart en haut, on donne le focus à la saisie). */
let renderedViewKey = null;
/* Naviguer ne doit jamais déposer un curseur dans un champ de saisie. Le
   focus n'est donné que lorsqu'on vient d'écrire quelque chose et qu'on
   enchaîne : cette variable porte cette intention d'un rendu au suivant. */
let focusAfterRender = null;
function viewKey(){
  const box = document.getElementById('search');
  if(box && box.value.trim()) return 'search';
  return state.view.type==='project' ? 'project:'+state.view.projectId : state.view.type;
}
function hms(ms){
  const h = String(Math.floor(ms/3600000)).padStart(2,'0');
  const m = String(Math.floor(ms/60000)%60).padStart(2,'0');
  const sec = String(Math.floor(ms/1000)%60).padStart(2,'0');
  return `${h}:${m}:${sec}`;
}
function updateTimerBar(){
  const tt = state.timeTracking;
  const cur = tt.current;
  const elapsed = document.getElementById('tbar-elapsed');
  if(!elapsed) return;
  document.getElementById('timerbar').classList.toggle('running', !!cur);
  document.querySelectorAll('.tbar-mode').forEach(b=>{
    b.classList.toggle('active', !!cur && cur.mode===b.dataset.mode);
    b.title = (cur && cur.mode===b.dataset.mode) ? 'Arrêter le chrono' : 'Démarrer « '+modeLabel(b.dataset.mode)+' »';
  });
  elapsed.textContent = cur ? hms(now()-cur.start) : '00:00:00';
  elapsed.classList.toggle('active', !!cur);
  elapsed.title = cur ? 'Séquence en cours — '+modeLabel(cur.mode) : 'Chrono à l\'arrêt';

  const pause = document.getElementById('tbar-pause');
  const resumable = !cur && !!tt.lastMode;
  pause.textContent = cur ? 'Pause' : 'Reprendre';
  pause.disabled = !cur && !resumable;
  pause.title = cur ? 'Mettre en pause' : (resumable ? 'Reprendre « '+modeLabel(tt.lastMode)+' »' : 'Aucune séquence à reprendre');

  const worked = todayWorked().total;
  const target = dailyTargetMs();
  const fill = document.getElementById('tbar-meter-fill');
  fill.style.width = Math.min(100, worked/target*100) + '%';
  fill.classList.toggle('reached', worked>=target);
  const label = `${fmtDuration(worked)} sur un objectif de ${state.settings.dailyTargetHours} h`;
  document.getElementById('tbar-meter').title = 'Journée : '+label;
  const day = document.getElementById('tbar-day');
  day.textContent = `${fmtDuration(worked)} / ${state.settings.dailyTargetHours} h`;
  day.title = label + ' — cliquer pour changer l\'objectif';
}
function bindTimerBar(){
  document.querySelectorAll('.tbar-mode').forEach(b=>{
    b.onclick = ()=> toggleTimer(b.dataset.mode);
  });
  document.getElementById('tbar-pause').onclick = ()=>{
    if(state.timeTracking.current) stopTimer(); else resumeTimer();
  };
  document.getElementById('tbar-day').onclick = ()=>{
    const val = prompt('Objectif de travail par jour, en heures :', String(state.settings.dailyTargetHours));
    if(val===null) return;
    const h = parseFloat(String(val).replace(',','.'));
    if(!isFinite(h) || h<=0 || h>24){ toast('Objectif invalide : indique un nombre d\'heures entre 1 et 24.'); return; }
    state.settings.dailyTargetHours = Math.round(h*100)/100;
    save(); render();
  };
}

function render(){
  const main = document.getElementById('main');
  const keyBefore = renderedViewKey;
  const scrollBefore = main ? main.scrollTop : 0;
  document.documentElement.setAttribute('data-theme', state.settings.theme);
  renderSidebar();
  renderMain();
  renderRightPanel();
  updateTimerBar();
  if(notesUI) renderNotesList();
  renderedViewKey = viewKey();
  if(main && renderedViewKey===keyBefore) main.scrollTop = scrollBefore;
  if(focusAfterRender){
    const el = document.getElementById(focusAfterRender);
    focusAfterRender = null;
    if(el) el.focus();
  }
}

function renderSearch(main, q){
  /* Cliquer sur un tag remplit la recherche avec « #tag » ; les tags sont
     stockés sans dièse, on l'ignore donc lors de la comparaison. */
  const term = q.replace(/^#/, '');
  if(!term){ main.innerHTML = `<div class="empty-state">Tape quelque chose à chercher.</div>`; return; }
  const results = allTasks().filter(t=> t.text.toLowerCase().includes(term) || (t.tags||[]).some(tag=>tag.toLowerCase().includes(term)));
  const notes = [];
  state.projects.forEach(pr=>pr.docs.forEach(d=>{
    if(d.title.toLowerCase().includes(term) || d.body.toLowerCase().includes(term)){
      notes.push({doc:d, project:pr});
    }
  }));

  let html = `<div class="section-title"><span>Tâches (${results.length})</span><span class="line"></span></div><div class="task-list">`;
  if(results.length===0) html += `<div class="empty-state" style="padding-top:10px">Aucune tâche pour « ${escapeHtml(q)} ».</div>`;
  results.forEach(t=>{ html += taskRow(t.projectId, t, true); });
  html += `</div>`;

  html += `<div class="section-title" style="margin-top:26px"><span>Notes (${notes.length})</span><span class="line"></span></div>`;
  if(notes.length===0){
    html += `<div class="empty-state" style="padding-top:10px">Aucune note pour « ${escapeHtml(q)} ».</div>`;
  } else {
    html += notes.map(({doc,project})=>`
      <div class="link-row" data-opendoc="${doc.id}" data-openproj="${project.id}" style="cursor:pointer">
        <div class="link-main">
          <div class="rp-task-text">${escapeHtml(doc.title)}</div>
          <div class="link-sub">${escapeHtml(project.name)} · ${escapeHtml(fmtRelative(doc.updatedAt))} · ${escapeHtml(searchExcerpt(doc.body, term))}</div>
        </div>
      </div>`).join('');
  }
  main.innerHTML = html;
  bindTaskEvents(main);
  main.querySelectorAll('[data-opendoc]').forEach(el=>{
    el.onclick = ()=> openNotes(el.dataset.openproj, el.dataset.opendoc);
  });
}
/* Extrait la portion de note qui contient le terme cherché. */
function searchExcerpt(body, term){
  const i = body.toLowerCase().indexOf(term);
  if(i<0) return excerpt(body);
  const from = Math.max(0, i-30);
  return (from>0?'…':'') + body.slice(from, i+term.length+50).replace(/\s+/g,' ').trim() + '…';
}

function renderCalendar(main){
  const monthStart = state.view.month || startOfMonth(now());
  const d = new Date(monthStart);
  const monthLabel = d.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  const firstDay = new Date(monthStart);
  const startWeekday = (firstDay.getDay()+6)%7; // 0=Mon
  const daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const tasks = allTasks().filter(t=>t.due && !t.done && !t.cancelled);
  const todayKey = startOfToday();
  const selectedDay = state.view.selectedDay || todayKey;

  let html = `
  <div class="project-header">
    <div class="project-title" style="text-transform:capitalize">${monthLabel}</div>
    <div class="project-actions">
      <button class="btn" id="cal-prev">◂</button>
      <button class="btn" id="cal-today">Aujourd'hui</button>
      <button class="btn" id="cal-next">▸</button>
    </div>
  </div>
  <div class="cal-grid">
    ${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div class="cal-headcell">${d}</div>`).join('')}`;

  for(let i=0;i<startWeekday;i++) html += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const cellDate = new Date(d.getFullYear(), d.getMonth(), day).getTime();
    const dayTasks = tasks.filter(t=>{
      const td = new Date(t.due); td.setHours(0,0,0,0);
      return td.getTime()===cellDate;
    });
    const isToday = cellDate===todayKey;
    const isSelected = cellDate===selectedDay;
    const isPast = cellDate<todayKey;
    html += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" data-day="${cellDate}">
      <div class="cal-daynum">${day}</div>
      ${dayTasks.length? `<div class="cal-dots">${dayTasks.slice(0,4).map(t=>`<span class="cal-dot" style="background:${isPast?'var(--red)':t.projectColor}"></span>`).join('')}${dayTasks.length>4?`<span class="cal-more">+${dayTasks.length-4}</span>`:''}</div>` : ''}
    </div>`;
  }
  html += `</div>`;

  const selectedTasks = tasks.filter(t=>{
    const td = new Date(t.due); td.setHours(0,0,0,0);
    return td.getTime()===selectedDay;
  });
  const selDateLabel = new Date(selectedDay).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
  html += `<div class="section-title" style="margin-top:26px"><span style="text-transform:capitalize">${selDateLabel}</span><span class="line"></span></div>
    <div class="task-list">`;
  if(selectedTasks.length===0){
    html += `<div class="empty-state" style="padding-top:10px">Aucune échéance ce jour-là.</div>`;
  } else {
    selectedTasks.forEach(t=>{ html += taskRow(t.projectId, t, true); });
  }
  html += `</div>`;

  main.innerHTML = html;
  bindTaskEvents(main);
  main.querySelectorAll('[data-day]').forEach(el=>{
    el.onclick = ()=>{ state.view.selectedDay = Number(el.dataset.day); save(); render(); };
  });
  document.getElementById('cal-prev').onclick = ()=>{
    const nd = new Date(monthStart); nd.setMonth(nd.getMonth()-1);
    state.view.month = nd.getTime(); save(); render();
  };
  document.getElementById('cal-next').onclick = ()=>{
    const nd = new Date(monthStart); nd.setMonth(nd.getMonth()+1);
    state.view.month = nd.getTime(); save(); render();
  };
  document.getElementById('cal-today').onclick = ()=>{
    state.view.month = startOfMonth(now()); state.view.selectedDay = startOfToday(); save(); render();
  };
}

function greetingWord(){
  const h = new Date().getHours();
  if(h<6) return 'Encore debout';
  if(h<12) return 'Bonjour';
  if(h<18) return 'Bon après-midi';
  return 'Bonsoir';
}
function getFocusTasks(){
  const tasks = allTasks().filter(t=>!t.done && !t.cancelled);
  const today = startOfToday();
  const scored = tasks.map(t=>{
    let score = 0;
    if(t.pinned) score += 100;
    if(t.due && t.due < today) score += 80;
    else if(t.due===today) score += 60;
    else if(t.due) score += Math.max(0, 30 - Math.floor((t.due-today)/86400000));
    if(t.priority==='high') score += 20;
    else if(t.priority==='medium') score += 8;
    return {t, score};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,3).map(s=>s.t);
}
function getLast7DaysActivity(){
  const days=[];
  const tasks = allTasks();
  for(let i=6;i>=0;i--){
    const dayStart = daysFromNow(-i);
    const dayEnd = dayStart + 86400000;
    const count = tasks.filter(t=>t.done && t.completedAt && t.completedAt>=dayStart && t.completedAt<dayEnd).length;
    days.push({date:dayStart, count});
  }
  return days;
}

/* Écart signé par rapport à une période nommée. La couleur dit si le sens
   de la variation est une bonne nouvelle, jamais le signe seul : le chiffre
   de comparaison est toujours écrit en toutes lettres juste en dessous. */
function deltaBadge(cur, prev, upIsGood){
  const d = cur - prev;
  if(d===0) return '';
  const good = (d>0)===upIsGood;
  return `<span class="stat-delta ${good?'up':'down'}">${d>0?'+':'\u2212'}${Math.abs(d)}</span>`;
}
function statusMeter(byStatus, total){
  if(!total) return `<div class="stat-meter"><span class="seg-empty"></span></div>`;
  const segs = [['todo','seg-todo'],['progress','seg-progress'],['waiting','seg-waiting']]
    .filter(([k])=>byStatus[k]>0)
    .map(([k,cls])=>`<span class="${cls}" style="flex:${byStatus[k]}"></span>`).join('');
  return `<div class="stat-meter">${segs}</div>`;
}
function statusBreakdown(byStatus, total){
  if(!total) return 'Aucune tâche ouverte.';
  const parts = [];
  if(byStatus.todo) parts.push(`<em>${byStatus.todo}</em> à faire`);
  if(byStatus.progress) parts.push(`<em>${byStatus.progress}</em> en cours`);
  if(byStatus.waiting) parts.push(`<em>${byStatus.waiting}</em> en attente`);
  return parts.join(' · ');
}
function daysAgoLabel(ts){
  const d = Math.round((startOfToday()-startOfDay(ts))/86400000);
  if(d<=0) return "aujourd'hui";
  if(d===1) return 'hier';
  return `il y a ${d} jours`;
}

function shouldShowWeeklyReview(){
  if(new Date().getDay()!==1) return false;
  return state.settings.reviewDismissedDate !== new Date().toDateString();
}

function renderTimerWeek(){
  const el = document.getElementById('timer-week');
  if(!el) return;
  const totals = weeklyTimeTotals(startOfWeekMonday(now()));
  el.innerHTML = `
    <div class="timer-week-item"><div class="timer-week-num meeting">${fmtDuration(totals.meeting)}</div><div class="timer-week-label">Réunion (semaine)</div></div>
    <div class="timer-week-item"><div class="timer-week-num progress">${fmtDuration(totals.progress)}</div><div class="timer-week-label">Avancement (semaine)</div></div>
  `;
}

function updateTimerDay(){
  const val = document.getElementById('timer-day-val');
  if(!val) return;
  const worked = todayWorked().total;
  const target = dailyTargetMs();
  val.textContent = `${fmtDuration(worked)} / ${state.settings.dailyTargetHours} h`;
  const fill = document.getElementById('timer-day-fill');
  fill.style.width = Math.min(100, worked/target*100) + '%';
  fill.classList.toggle('reached', worked>=target);
}
function updateTimerLive(){
  updateTimerDay();
  const live = document.getElementById('timer-live');
  const mBtn = document.getElementById('timer-meeting');
  const pBtn = document.getElementById('timer-progress');
  if(!live) return;
  const cur = state.timeTracking.current;
  if(mBtn) mBtn.classList.toggle('running', cur && cur.mode==='meeting');
  if(pBtn) pBtn.classList.toggle('running', cur && cur.mode==='progress');
  if(cur){
    const ms = now()-cur.start;
    const h = String(Math.floor(ms/3600000)).padStart(2,'0');
    const m = String(Math.floor(ms/60000)%60).padStart(2,'0');
    const s = String(Math.floor(ms/1000)%60).padStart(2,'0');
    live.textContent = `${h}:${m}:${s}`;
    live.classList.add('active');
  } else {
    live.textContent = '00:00:00';
    live.classList.remove('active');
  }
}

      const l = project.links.find(x=>x.id===b.dataset.rename); if(!l) return;

    });

      const l = project.links.find(x=>x.id===b.dataset.note); if(!l) return;
      const val = prompt('Précision (qui l\'a partagé, à quoi il sert…) :', l.note);
      if(val===null) return;
      l.note = val.trim();

    });

        save(); render();
      });

  }
  const input = host.querySelector('#link-url');

    save(); render();

/* L'édition en place ne démarre qu'au double-clic. Un clic simple ne pose
   plus de curseur : il ne se passe rien tant qu'on n'a pas dit qu'on voulait
   modifier le texte. */
function caretRangeAt(x, y){
  if(document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
  if(document.caretPositionFromPoint){
    const pos = document.caretPositionFromPoint(x, y);
    if(!pos) return null;
    const r = document.createRange();
    r.setStart(pos.offsetNode, pos.offset); r.collapse(true);
    return r;
  }
  return null;
}
function beginEdit(el, ev){
  if(el.isContentEditable) return;
  el.dataset.original = el.textContent;
  el.contentEditable = 'true';
  el.classList.add('editing');
  el.focus();
  const sel = window.getSelection();
  let range = ev ? caretRangeAt(ev.clientX, ev.clientY) : null;
  if(!range || !el.contains(range.startContainer)){
    range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
  }
  sel.removeAllRanges();
  sel.addRange(range);
}
function endEdit(el){
  el.contentEditable = 'false';
  el.classList.remove('editing');
}
/* Entrée valide, Échap annule et remet le texte d'origine. */
function editKeys(el, onCancel){
  return (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); el.blur(); }
    else if(e.key==='Escape'){
      e.stopPropagation();
      el.textContent = onCancel();
      el.blur();
    }
  };
}

function bindTaskEvents(scope){
  scope.querySelectorAll('.task').forEach(row=>{
    const projectId = row.dataset.proj;
    const taskId = row.dataset.task;
    row.querySelector('[data-action="toggle"]').onclick = ()=> toggleDone(projectId, taskId);
    row.querySelector('[data-action="pin"]').onclick = ()=> togglePin(projectId, taskId);
    row.querySelector('[data-action="cancel"]').onclick = ()=> toggleCancelled(projectId, taskId);
    row.querySelector('[data-action="delete"]').onclick = ()=> deleteTask(projectId, taskId);
    const textEl = row.querySelector('[data-action="edit"]');
    textEl.ondblclick = (e)=> beginEdit(textEl, e);
    textEl.onblur = ()=>{
      endEdit(textEl);
      const val = textEl.textContent.trim();
      const before = textEl.dataset.original || '';
      if(!val){ textEl.textContent = before; return; }
      if(val!==before.trim()) updateTask(projectId, taskId, {text:val});
    };
    textEl.onkeydown = editKeys(textEl, ()=> textEl.dataset.original || '');

    const dueBtn = row.querySelector('[data-action="due"]');
    if(dueBtn) dueBtn.onclick = ()=>{
      const p = getProject(projectId); const t = p.tasks.find(x=>x.id===taskId);
      const val = prompt("Date d'échéance (AAAA-MM-JJ), vide pour retirer :", t.due? new Date(t.due).toISOString().slice(0,10):'');
      if(val===null) return;
      updateTask(projectId, taskId, {due: val? new Date(val+'T00:00:00').getTime() : null});
    };
    const tagBtn = row.querySelector('[data-action="tag"]');
    if(tagBtn) tagBtn.onclick = ()=>{
      const p = getProject(projectId); const t = p.tasks.find(x=>x.id===taskId);
      const val = prompt('Ajouter un tag :');
      if(val && val.trim()) updateTask(projectId, taskId, {tags:[...(t.tags||[]), val.trim()]});
    };
    row.querySelectorAll('[data-action="filtertag"]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); document.getElementById('search').value = '#'+el.dataset.tag; renderMain(); };
    });
    const recurBtn = row.querySelector('[data-action="recur"]');
    if(recurBtn) recurBtn.onclick = ()=>{
      const p = getProject(projectId); const t = p.tasks.find(x=>x.id===taskId);
      const val = prompt('Répétition : daily / weekly / monthly / none', t.recurring||'none');
      if(val===null) return;
      updateTask(projectId, taskId, {recurring: ['daily','weekly','monthly'].includes(val)? val : null});
    };
    const statusBtn = row.querySelector('[data-action="status"]');
    if(statusBtn) statusBtn.onclick = ()=>{
      const p = getProject(projectId); const t = p.tasks.find(x=>x.id===taskId);
      const order = ['todo','progress','waiting'];
      const idx = order.indexOf(t.status||'todo');
      const next = order[(idx+1)%order.length];
      if(next==='waiting'){
        const who = prompt('En attente de qui / quoi ?', t.waitingOn||'');
        if(who===null) return;
        updateTask(projectId, taskId, {status:'waiting', waitingOn: who});
      } else {
        updateTask(projectId, taskId, {status:next, waitingOn:''});
      }
    };
    const addSub = row.querySelector('[data-action="addsub"]');
    if(addSub) addSub.onclick = ()=>{
      const val = prompt('Sous-tâche :');
      if(val && val.trim()) addSubtask(projectId, taskId, val);
    };
    row.querySelectorAll('[data-action="subtoggle"]').forEach(el=>{
      el.onclick = ()=> toggleSubtask(projectId, taskId, el.dataset.sub);
    });
  });
}

/* ===================== NOTES DU PROJET ===================== */
/* L'explorateur s'ouvre en surimpression, en une seule couche : la liste à
   gauche, l'éditeur à droite. Passer d'une note à l'autre reste un clic.
   Son état vit ici et non dans les données sauvegardées : rouvrir
   l'application ne doit pas rouvrir un panneau. */
let notesUI = null;

function sortedDocs(project, filter){
  const q = (filter||'').trim().toLowerCase();
  return project.docs
    .filter(d=> !q || d.title.toLowerCase().includes(q) || d.body.toLowerCase().includes(q))
    .sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || b.updatedAt-a.updatedAt);
}
function fmtRelative(ts){
  const mins = Math.round((now()-ts)/60000);
  if(mins<1) return "à l'instant";
  if(mins<60) return `il y a ${mins} min`;
  const days = Math.round((startOfToday()-startOfDay(ts))/86400000);
  if(days===0) return `à ${new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;
  if(days===1) return 'hier';
  if(days<7) return `il y a ${days} jours`;
  return fmtDate(ts);
}
function excerpt(body){
  const line = body.split('\n').find(l=>l.trim());
  return line ? line.trim().slice(0,80) : 'Note vide';
}
function defaultDocTitle(){
  const cur = state.timeTracking.current;
  if(cur && cur.mode==='meeting'){
    return 'Réunion du ' + new Date().toLocaleDateString('fr-FR',{day:'numeric', month:'long'});
  }
  return 'Note du ' + new Date().toLocaleDateString('fr-FR',{day:'numeric', month:'long'});
}
function addDoc(project){
  const cur = state.timeTracking.current;
  const d = normalizeDoc({
    id: uid(), title: defaultDocTitle(), body:'',
    createdAt: now(), updatedAt: now(),
    meetingStart: (cur && cur.mode==='meeting') ? cur.start : null
  });
  project.docs.unshift(d);
  save();
  return d;
}
function deleteDoc(project, docId){
  const idx = project.docs.findIndex(d=>d.id===docId);
  if(idx<0) return;
  const [removed] = project.docs.splice(idx,1);
  state.trash.push({type:'doc', data:removed, projectId:project.id, deletedAt:now()});
  purgeTrash();
  if(notesUI && notesUI.docId===docId) notesUI.docId = (project.docs[0]||{}).id || null;
  save(); renderNotes(); renderSidebar();
  toast('Note supprimée.', 'Annuler', ()=>{
    project.docs.splice(Math.min(idx, project.docs.length), 0, removed);
    state.trash = state.trash.filter(x=>!(x.type==='doc' && x.data.id===removed.id));
    if(notesUI) notesUI.docId = removed.id;
    save(); renderNotes(); renderSidebar();
  });
}
/* À l'arrêt d'un chrono Réunion, la note ouverte pendant cette séquence
   reçoit sa durée. */
function linkMeetingToDoc(mode, start, end){
  if(mode!=='meeting') return;
  state.projects.forEach(p=>p.docs.forEach(d=>{
    if(d.meetingStart===start) d.meetingMs = end - start;
  }));
}

function openNotes(projectId, docId){
  const project = getProject(projectId);
  if(!project) return;
  closeNotes();
  const docs = sortedDocs(project, '');
  notesUI = {
    projectId,
    docId: docId || (docs[0] ? docs[0].id : null),
    filter: '',
    onNote: !!docId
  };
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'notes-overlay';
  bg.innerHTML = `
    <div class="notes-panel">
      <div class="notes-side">
        <div class="notes-side-head">
          <div class="notes-side-title"><span>Notes · ${escapeHtml(project.name)}</span></div>
          <input type="text" class="notes-filter" id="notes-filter" placeholder="Filtrer…">
          <button class="btn primary" id="notes-new" style="width:100%">＋ Nouvelle note</button>
        </div>
        <div class="notes-list" id="notes-list"></div>
      </div>
      <div class="notes-editor" id="notes-editor"></div>
    </div>`;
  document.body.appendChild(bg);
  bg.onclick = (e)=>{ if(e.target===bg) closeNotes(); };
  bg.querySelector('#notes-new').onclick = ()=>{
    const d = addDoc(project);
    notesUI.docId = d.id; notesUI.onNote = true; notesUI.filter='';
    const f = document.getElementById('notes-filter'); if(f) f.value='';
    renderNotes(); renderSidebar();
    const t = document.getElementById('note-title');
    if(t){ t.focus(); t.select(); }
  };
  const filter = bg.querySelector('#notes-filter');
  filter.oninput = ()=>{ notesUI.filter = filter.value; renderNotesList(); };
  renderNotes();
}
function closeNotes(){
  const el = document.getElementById('notes-overlay');
  if(el) el.remove();
  notesUI = null;
}
function renderNotes(){ renderNotesList(); renderNotesEditor(); }

function renderNotesList(){
  if(!notesUI) return;
  const project = getProject(notesUI.projectId);
  const list = document.getElementById('notes-list');
  if(!project || !list) return;
  const panel = document.querySelector('.notes-panel');
  if(panel) panel.classList.toggle('on-note', notesUI.onNote);
  const docs = sortedDocs(project, notesUI.filter);
  if(docs.length===0){
    list.innerHTML = `<div class="rp-empty">${notesUI.filter? 'Aucune note ne correspond.' : 'Aucune note pour ce projet.'}</div>`;
    return;
  }
  list.innerHTML = docs.map(d=>`
    <div class="note-row ${d.id===notesUI.docId?'active':''}" data-doc="${d.id}">
      <div class="note-row-title">${d.pinned?'<span class="note-row-pin">★</span>':''}<span class="note-row-name">${escapeHtml(d.title)}</span></div>
      <div class="note-row-meta">${escapeHtml(fmtRelative(d.updatedAt))}${d.meetingMs?' · '+fmtDuration(d.meetingMs):''}</div>
      <div class="note-row-excerpt">${escapeHtml(excerpt(d.body))}</div>
    </div>`).join('');
  list.querySelectorAll('[data-doc]').forEach(el=>{
    el.onclick = ()=>{ notesUI.docId = el.dataset.doc; notesUI.onNote = true; renderNotes(); };
  });
}

function renderNotesEditor(){
  if(!notesUI) return;
  const project = getProject(notesUI.projectId);
  const host = document.getElementById('notes-editor');
  if(!project || !host) return;
  const doc = project.docs.find(d=>d.id===notesUI.docId);
  if(!doc){
    host.innerHTML = `<div class="notes-empty">Choisis une note à gauche, ou crée-en une nouvelle.</div>`;
    return;
  }
  host.innerHTML = `
    <div class="notes-editor-head">
      <button class="btn notes-back" id="note-back" style="margin-bottom:8px">‹ Toutes les notes</button>
      <input type="text" class="note-title-input" id="note-title" value="${escapeHtml(doc.title)}" placeholder="Titre de la note">
      <div class="note-meta">
        <span id="note-status">Modifiée ${escapeHtml(fmtRelative(doc.updatedAt))}</span>
        ${doc.meetingMs? `<span>· Réunion de ${fmtDuration(doc.meetingMs)}</span>`:''}
      </div>
    </div>
    <textarea class="note-body" id="note-body" placeholder="Écris ici. Tout est enregistré au fur et à mesure.">${escapeHtml(doc.body)}</textarea>
    <div class="notes-toolbar">
      <button class="btn" id="note-task">Faire une tâche de la sélection</button>
      <button class="btn" id="note-pin">${doc.pinned?'Désépingler':'Épingler'}</button>
      <button class="btn" id="note-export">Exporter en .txt</button>
      <button class="btn" id="note-delete">Supprimer</button>
      <span class="hint"><kbd>Ctrl</kbd>+<kbd>Entrée</kbd> crée une tâche · <kbd>Échap</kbd> ferme</span>
    </div>`;

  const title = document.getElementById('note-title');
  const body  = document.getElementById('note-body');
  const status= document.getElementById('note-status');
  const touch = ()=>{
    doc.updatedAt = now();
    save();
    status.textContent = 'Enregistrée à l\'instant';
    status.className = 'note-saved';
    clearTimeout(renderNotesEditor._t);
    renderNotesEditor._t = setTimeout(()=>{
      const row = document.querySelector(`.note-row[data-doc="${doc.id}"]`);
      if(row){
        const t = row.querySelector('.note-row-name');
        const m = row.querySelector('.note-row-meta');
        const e = row.querySelector('.note-row-excerpt');
        if(t) t.textContent = doc.title;
        if(m) m.textContent = fmtRelative(doc.updatedAt) + (doc.meetingMs? ' · '+fmtDuration(doc.meetingMs) : '');
        if(e) e.textContent = excerpt(doc.body);
      }
    }, 600);
  };
  title.oninput = ()=>{ doc.title = title.value || 'Sans titre'; touch(); };
  body.oninput  = ()=>{ doc.body = body.value; touch(); };

  const back = document.getElementById('note-back');
  back.onclick = ()=>{ notesUI.onNote = false; renderNotesList(); };

  document.getElementById('note-pin').onclick = ()=>{
    doc.pinned = !doc.pinned;
    save(); renderNotes();
  };
  document.getElementById('note-export').onclick = ()=>{
    const safe = (doc.title||'note').replace(/[^\p{L}\p{N} _-]/gu,'').trim().slice(0,60) || 'note';
    downloadFile(doc.title + '\n\n' + doc.body, safe + '.txt', 'text/plain;charset=utf-8');
  };
  document.getElementById('note-delete').onclick = ()=>{
    if(confirm(`Supprimer la note « ${doc.title} » ?`)) deleteDoc(project, doc.id);
  };
  document.getElementById('note-task').onclick = ()=> taskFromSelection(project, body);
  body.onkeydown = (e)=>{
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); taskFromSelection(project, body); }
  };
}

/* Transforme la sélection en tâche, ou à défaut la ligne où se trouve le
   curseur. Le texte de la note n'est pas modifié. */
function taskFromSelection(project, body){
  let text = body.value.slice(body.selectionStart, body.selectionEnd).trim();
  if(!text){
    const start = body.value.lastIndexOf('\n', Math.max(0, body.selectionStart-1)) + 1;
    let end = body.value.indexOf('\n', body.selectionStart);
    if(end<0) end = body.value.length;
    text = body.value.slice(start, end).trim();
  }
  text = text.replace(/^[-*•\s\[\]xX]+/,'').trim();
  if(!text){ toast('Rien à transformer : place le curseur sur une ligne de texte.'); return; }
  addTask(project.id, text.slice(0,300), {});
  toast('Tâche créée : ' + text.slice(0,60));
}

function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
function exportData(){
  const d = new Date().toISOString().slice(0,10);
  downloadFile(JSON.stringify(state, null, 2), `atelier-sauvegarde-${d}.json`, 'application/json');

}
