document.getElementById('file-input').onchange = (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const imported = normalizeState(JSON.parse(ev.target.result));
      if(!Array.isArray(imported.projects)) throw new Error('format invalide');
      const replace = confirm('Remplacer toutes les données actuelles par ce fichier ?\nAnnuler = fusionner les projets importés avec les actuels.');
      if(replace){
        state = imported;
        purgeTrash();
      } else {
        imported.projects.forEach(p=>{ p.id = uid(); p.tasks.forEach(t=>{ t.id = uid(); }); state.projects.push(p); });
      }
      save(); render();
      toast('Import réussi.');
    }catch(err){
      alert('Fichier invalide : '+err.message);
    }
  };
  reader.readAsText(file);
  e.target.value='';
};

document.getElementById('btn-help').onclick = ()=>{
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML = `<div class="modal">
    <h3>Raccourcis</h3>
    <div class="help-list">
      <div><kbd>/</kbd> Rechercher</div>
      <div><kbd>n</kbd> Écrire une nouvelle tâche (projet ou boîte de réception)</div>
      <div><kbd>p</kbd> Nouveau projet</div>
      <div><kbd>i</kbd> Capture rapide (inbox)</div>
      <div><kbd>d</kbd> Notes du projet ouvert</div>
      <div><kbd>Échap</kbd> Fermer / annuler / désélectionner</div>
      <div style="margin-top:10px">Double-clic sur le texte d'une tâche ou sur le nom d'un projet pour le modifier, <kbd>Entrée</kbd> pour valider.</div>
    </div>
    <div class="modal-actions"><button class="btn" id="close-help">Fermer</button></div>
  </div>`;
  document.body.appendChild(bg);
  document.getElementById('close-help').onclick = ()=> document.body.removeChild(bg);
  bg.onclick=(e)=>{ if(e.target===bg) document.body.removeChild(bg); };
};

function openCaptureModal(){
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML = `<div class="modal">
    <h3>Capture rapide</h3>
    <div class="field"><input type="text" id="capture-input" placeholder="Note ou tâche à trier plus tard…"></div>
    <div class="modal-actions"><button class="btn" id="cancel-capture">Annuler</button><button class="btn primary" id="save-capture">Ajouter à l'inbox</button></div>
  </div>`;
  document.body.appendChild(bg);
  const input = bg.querySelector('#capture-input');
  input.focus();
  const commit = ()=>{
    if(input.value.trim()) addInboxItem(input.value);
    document.body.removeChild(bg);
  };
  input.onkeydown = (e)=>{ if(e.key==='Enter') commit(); if(e.key==='Escape') document.body.removeChild(bg); };
  bg.querySelector('#save-capture').onclick = commit;
  bg.querySelector('#cancel-capture').onclick = ()=> document.body.removeChild(bg);
  bg.onclick = (e)=>{ if(e.target===bg) document.body.removeChild(bg); };
}

document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName||'').toLowerCase();
  const editing = tag==='input' || tag==='textarea' || e.target.isContentEditable;
  if(e.key==='/' && !editing){ e.preventDefault(); document.getElementById('search').focus(); }
  else if(e.key==='Escape'){
    const modals = document.querySelectorAll('.modal-bg');
    if(modals.length){ modals[modals.length-1].remove(); return; }
    if(editing) e.target.blur();
    const box = document.getElementById('search');
    if(box.value){ box.value=''; renderMain(); }
  }
  else if(e.key==='n' && !editing){
    const el = document.getElementById('new-task-input') || document.getElementById('inbox-input');
    if(el){ e.preventDefault(); el.focus(); }
  }
  else if(e.key==='p' && !editing){
    e.preventDefault();
    const name = prompt('Nom du projet :');
    if(name && name.trim()) addProject(name.trim());
  }
  else if(e.key==='i' && !editing){
    e.preventDefault();
    openCaptureModal();
  }
  else if(e.key==='d' && !editing && state.view.type==='project' && !notesUI){
    e.preventDefault();
    openNotes(state.view.projectId);
  }
});

/* ===================== NOTIFICATIONS ===================== */
function checkNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const today = startOfToday();
  const soon = daysFromNow(1);
  allTasks().forEach(t=>{
    if(t.done || t.cancelled || !t.due || state.notified[t.id]) return;
    if(t.due <= soon){
      new Notification(t.due < today ? 'Tâche en retard' : 'Échéance demain', {body: `${t.text} — ${t.projectName}`});
      state.notified[t.id] = true; save();
    }
  });
}
function askNotifPermission(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission();
  }
}
setTimeout(checkNotifications, 2000);
setInterval(checkNotifications, 5*60*1000);
window.addEventListener('click', function once(){ askNotifPermission(); window.removeEventListener('click', once); });

/* ===================== INIT ===================== */
if(purgeTrash()) save();
bindTimerBar();
render();
})();
</script>
